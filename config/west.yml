manifest:
  defaults:
    revision: v0.3

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-unicode
      remote: urob
      revision: v0.3 # keep in sync with the ZMK revision above

  self:
    path: config
