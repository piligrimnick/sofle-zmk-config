# Basic bring-up configuration for Sofle Choc V3.5.
# Displays and encoders stay disabled for the first hardware test.

# Uncomment both lines after the basic key matrix works to enable EC11 encoders.
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED (SSD1306) support:
CONFIG_ZMK_DISPLAY=n

# ZMK calls all addressable LEDs "underglow". On this PCB the chain contains
# only the 29 per-key LEDs on each half; the custom shield supplies the V3.5
# data pin and exact chain length. Brightness is intentionally battery-safe.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
# ZMK scales its internal 0-100 brightness through BRT_MAX. A step of 7
# reaches the 30% output cap in 15 presses (about 2% output per press).
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=7
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
